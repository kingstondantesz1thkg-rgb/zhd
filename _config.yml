# 👋 你好，我是郑泓达！

欢迎来到我的个人主页！我是一名充满热情的开发者，热衷于探索前沿技术并将其应用于实际项目中。

## 💼 核心技能

- **前端开发**: HTML5 / CSS3 / JavaScript / React / Vue
- **后端架构**: Node.js / Python / Java / 数据库设计
- **工具与部署**: Git / Docker / Hexo / 自动化 CI/CD

---

## 🚀 项目经验

### 1. 个人全栈博客系统 (2025 - 2026)
- **技术栈**：Hexo + Butterfly + GitHub Pages
- **项目描述**：独立搭建并维护的个人技术品牌门户，实现了文章发布、分类管理、全站搜索以及互动评论功能。
- **项目成就**：通过深度定制主题与前端性能优化，将页面首次渲染时间降低了 40%，有效提升了访问体验。

### 2. 企业级后台管理系统 (2024 - 2025)
- **技术栈**：Vue3 + TypeScript + Spring Boot
- **项目描述**：为某中型企业开发的内部数据管理平台，支持动态权限路由、大数据表格导出、以及实时图表监控。
- **项目成就**：优化了原有繁琐的审批流，提升了跨部门协作效率，系统月均稳定处理数据量超百万条。

